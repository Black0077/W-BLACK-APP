name: Build W-BLACK APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Prepare W-BLACK
        run: |
          mkdir -p www
          npm run build

      - name: Initialize Capacitor
        run: |
          npx cap init W-BLACK com.wblack.trading --web-dir www

      - name: Add Android
        run: |
          npx cap add android

      - name: Copy W-BLACK into Android
        run: |
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: W-BLACK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
